<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>正面深蹲分析</title>
  <style>
    :root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;--ink:#07120e;--panel:rgba(7,18,14,.82);--mint:#62efad;--cyan:#64c9ff;--amber:#ffc857}
    *{box-sizing:border-box}html,body,#stage{height:100%;margin:0;overflow:hidden;background:var(--ink)}
    #video,#skeleton{height:100%;inset:0;object-fit:cover;position:absolute;transform:scaleX(-1);width:100%}#skeleton{pointer-events:none}
    #start-screen{align-items:center;background:radial-gradient(circle at 50% 30%,#294c3d 0,#101c17 48%,#07120e 100%);display:flex;flex-direction:column;inset:0;justify-content:center;padding:28px;position:absolute;text-align:center;z-index:5}
    #start-screen[hidden]{display:none}.eyebrow{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.22em;margin-bottom:14px}h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.05em;margin:0 0 12px}p{color:#aec4ba;line-height:1.65;margin:0 0 28px;max-width:540px}
    button{background:var(--mint);border:0;border-radius:999px;color:#062218;cursor:pointer;font-size:18px;font-weight:900;padding:17px 36px}button:focus-visible{outline:3px solid #fff;outline-offset:4px}
    #hud{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(74px,1fr));left:18px;position:absolute;right:18px;top:18px;z-index:3}.metric{backdrop-filter:blur(12px);background:var(--panel);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:10px 12px}.metric strong{display:block;font-size:clamp(20px,3vw,30px)}.metric span,.chart-label{color:#a9beb5;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    #trend-panel{backdrop-filter:blur(14px);background:var(--panel);border:1px solid rgba(255,255,255,.11);border-radius:18px;bottom:70px;padding:14px;position:absolute;right:18px;width:min(390px,calc(100% - 36px));z-index:3}#trend-head{align-items:center;display:flex;justify-content:space-between;margin-bottom:8px}#connection{align-items:center;color:#b5c8bf;display:flex;font-size:11px;gap:7px}#connection-dot{background:#708078;border-radius:50%;height:8px;width:8px}#connection[data-online="true"] #connection-dot{background:var(--mint);box-shadow:0 0 12px var(--mint)}svg{display:block;height:110px;width:100%}.grid{stroke:rgba(255,255,255,.1);stroke-width:1}.trace{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:3}.legend{display:flex;gap:14px;margin-top:5px}.legend span{font-size:10px}.legend i{border-radius:3px;display:inline-block;height:3px;margin-right:5px;vertical-align:middle;width:14px}
    #status{background:rgba(7,18,14,.9);border:1px solid rgba(255,255,255,.12);border-radius:999px;bottom:18px;color:#fff;font-size:13px;font-weight:750;left:50%;padding:10px 16px;position:absolute;transform:translateX(-50%);white-space:nowrap;z-index:4}#status[data-error="true"]{background:#762d2d}
    #end{background:rgba(111,35,35,.88);color:#fff;font-size:13px;padding:11px 18px;position:absolute;right:18px;top:92px;z-index:6}#end[hidden]{display:none}
    #report-screen{background:linear-gradient(145deg,#eef4f0,#dcebe3);color:#10251c;display:grid;inset:0;overflow:auto;padding:clamp(22px,4vw,52px);position:absolute;z-index:8}#report-screen[hidden]{display:none}.report-wrap{margin:auto;max-width:1500px;width:100%}.report-head{align-items:end;display:flex;gap:20px;justify-content:space-between}.report-head h2{font-size:clamp(34px,6vw,68px);letter-spacing:-.055em;margin:0}.quality-banner{background:#e8f7ef;border-left:5px solid #17845a;border-radius:14px;color:#173e2f;margin-top:24px;padding:14px 18px}.quality-banner[data-level="caution"]{background:#fff5d9;border-color:#d08c19;color:#5f430d}.quality-banner[data-level="low"]{background:#fff0eb;border-color:#d35e3d;color:#6c2917}.quality-banner b{margin-right:8px}.report-kpis{display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin:14px 0 18px}.report-kpi{background:#fff;border-radius:18px;padding:18px}.report-kpi strong{display:block;font-size:32px}.report-kpi span{color:#53665c;font-size:11px}.report-kpi small{color:#73847b;display:block;margin-top:5px}.report-conclusion{background:#123e2e;border-radius:20px;color:#fff;font-size:clamp(18px,2vw,25px);font-weight:750;line-height:1.45;margin-bottom:18px;padding:20px 24px}.report-body{display:grid;gap:18px;grid-template-columns:1.45fr .55fr}.report-card{background:#fff;border-radius:22px;padding:20px}.report-card h3{margin:0 0 14px}.small-multiples{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}.mini-chart{border:1px solid #e0e9e4;border-radius:14px;padding:12px}.mini-chart-head{align-items:baseline;display:flex;gap:8px;justify-content:space-between}.mini-chart-head b{font-size:13px}.mini-chart-head span{color:#687a70;font-size:10px}.mini-chart svg{height:105px;width:100%}.chart-empty{align-items:center;color:#718178;display:flex;height:105px;justify-content:center}.summary-list{display:grid;gap:12px}.summary-item{border-bottom:1px solid #e5ebe7;padding-bottom:10px}.summary-item span{color:#5e7167;display:block;font-size:11px}.summary-item b{font-size:20px}.recommendations{color:#324c40;margin:14px 0 0;padding-left:20px}.recommendations li{margin:8px 0}.rep-table{overflow-x:auto}.rep-row{border-top:1px solid #e1e9e4;display:grid;gap:12px;grid-template-columns:70px repeat(4,minmax(120px,1fr));min-width:650px;padding:11px 0}.rep-row[data-head="true"]{color:#5a6d63;font-size:11px;font-weight:750}.rep-status{color:#17754f;font-weight:750}.report-actions{margin-top:20px}.report-actions button{background:#176a48;color:#fff}
    @media(max-width:800px){#hud{grid-template-columns:repeat(2,1fr)}#end{top:150px}#trend-panel{bottom:68px}.metric strong{font-size:21px}.report-head{align-items:start;flex-direction:column}.report-kpis{grid-template-columns:repeat(2,1fr)}.report-body,.small-multiples{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="stage">
    <video id="video" playsinline autoplay muted></video><canvas id="skeleton"></canvas>
    <section id="hud" aria-label="实时深蹲计数">
      <div class="metric"><strong id="reps">0</strong><span>前端实时计数</span></div>
      <div class="metric"><strong id="phase">待机</strong><span>动作阶段</span></div>
      <div class="metric"><strong id="knee">--%</strong><span>下蹲幅度</span></div>
      <div class="metric"><strong id="frames">0%</strong><span>有效帧率</span></div>
    </section>
    <section id="trend-panel" aria-label="Python逐秒分析">
      <div id="trend-head"><div><b>逐秒动作分析</b><div class="chart-label">最近 20 秒 · Python 聚合</div></div><div id="connection" data-online="false"><i id="connection-dot"></i><span id="connection-text">等待连接</span></div></div>
      <svg viewBox="0 0 360 110" preserveAspectRatio="none" role="img" aria-label="膝部横向波动、重心偏移和左右膝角差趋势">
        <path class="grid" d="M0 27.5H360M0 55H360M0 82.5H360"/>
        <polyline id="ratio-line" class="trace" stroke="#62efad"/>
        <polyline id="shift-line" class="trace" stroke="#64c9ff"/>
        <polyline id="valgus-line" class="trace" stroke="#ffc857"/>
      </svg>
      <div class="legend"><span><i style="background:#62efad"></i>膝部波动</span><span><i style="background:#64c9ff"></i>重心偏移</span><span><i style="background:#ffc857"></i>膝角差</span></div>
    </section>
    <div id="status">点击开始后才会采集并发送分析数据</div>
    <button id="end" type="button" hidden>结束分析</button>
    <section id="start-screen"><div class="eyebrow">FRONTAL SQUAT · LIVE LAB</div><h1>正面深蹲分析</h1><p>前端即时计数，Python 每秒返回对称性、膝内扣与重心偏移趋势。视频始终留在浏览器，只发送骨骼关键点。</p><button id="start" type="button">开始分析</button></section>
    <section id="report-screen" hidden aria-label="深蹲分析报告"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
  <script>
    const $=id=>document.getElementById(id),stage=$('stage'),video=$('video'),canvas=$('skeleton'),ctx=canvas.getContext('2d'),startScreen=$('start-screen'),startButton=$('start'),endButton=$('end'),reportScreen=$('report-screen'),status=$('status'),reps=$('reps'),phase=$('phase'),knee=$('knee'),frames=$('frames'),connection=$('connection'),connectionText=$('connection-text');
    const phaseLabels={'finding-subject':'校准','standing':'站立','descending':'下蹲','bottom':'底部','ascending':'站起'};
    let camera,socket,running=false,enteredFullscreen=false,sequence=0,series=[],sessionStartedAt=0,ending=false;
    const counter={phase:'finding-subject',repetitions:0,partialRepetitions:0,stable:0,total:0,valid:0,calibrationFrames:0,baselineHipY:0,baselineLegLength:0,depth:0,repStartedAt:undefined,bottomAt:undefined,maxDepth:0,reps:[]};
    function setStatus(text,error=false){status.textContent=text;status.dataset.error=String(error)}
    function emit(message){const raw=JSON.stringify(message);if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(raw);else if(window.parent!==window)window.parent.postMessage(raw,window.location.origin)}
    function angle(a,b,c){const ab=[a.x-b.x,a.y-b.y],cb=[c.x-b.x,c.y-b.y],den=Math.hypot(...ab)*Math.hypot(...cb);if(!den)return 180;return Math.acos(Math.max(-1,Math.min(1,(ab[0]*cb[0]+ab[1]*cb[1])/den)))*180/Math.PI}
    function updateCounter(lm){
      counter.total++;const required=[11,12,23,24,25,26,27,28],score=Math.min(...required.map(i=>lm[i]?.visibility??0));
      if(score<.6){counter.stable=0;renderCounter();setStatus('请后退，确保全身完整入镜');return}
      counter.valid++;const hipY=(lm[23].y+lm[24].y)/2,legLength=(Math.hypot(lm[23].x-lm[27].x,lm[23].y-lm[27].y)+Math.hypot(lm[24].x-lm[28].x,lm[24].y-lm[28].y))/2;
      if(counter.calibrationFrames<20){counter.calibrationFrames++;counter.baselineHipY+=(hipY-counter.baselineHipY)/counter.calibrationFrames;counter.baselineLegLength+=(legLength-counter.baselineLegLength)/counter.calibrationFrames;counter.phase='finding-subject';renderCounter();setStatus(`站直校准中 ${counter.calibrationFrames}/20`);if(counter.calibrationFrames===20){counter.phase='standing';setStatus('校准完成，可以开始深蹲')}return}
      const rawDepth=Math.max(0,(hipY-counter.baselineHipY)/Math.max(counter.baselineLegLength,.001));counter.depth=.35*rawDepth+.65*counter.depth;
      const d=counter.depth,p=counter.phase,now=performance.now();
      if(p==='finding-subject'){counter.phase='standing';counter.stable=0}
      else if(p==='standing'&&d>.08){counter.phase='descending';counter.stable=0;counter.repStartedAt=now;counter.bottomAt=undefined;counter.maxDepth=d}
      else if(p==='descending'){counter.maxDepth=Math.max(counter.maxDepth,d);if(d>=.22){counter.stable++;if(counter.stable>=3){counter.phase='bottom';counter.bottomAt=now;counter.stable=0}}else if(d<=.06){counter.phase='standing';counter.stable=0;counter.partialRepetitions++;counter.repStartedAt=undefined}else counter.stable=0}
      else if(p==='bottom'){counter.maxDepth=Math.max(counter.maxDepth,d);if(d<.17){counter.phase='ascending';counter.stable=0}}
      else if(p==='ascending'){if(d<=.06){counter.stable++;if(counter.stable>=3){counter.phase='standing';counter.stable=0;counter.repetitions++;counter.reps.push({repId:counter.repetitions,startedAtMs:counter.repStartedAt-sessionStartedAt,bottomAtMs:counter.bottomAt-sessionStartedAt,completedAtMs:now-sessionStartedAt,durationMs:now-counter.repStartedAt,maxDepthPercent:counter.maxDepth*100,minKneeAngle:0});counter.repStartedAt=undefined}}else if(d>=.22){counter.phase='bottom';counter.stable=0}else counter.stable=0}
      if(counter.phase==='standing'&&d<.04){counter.baselineHipY=.995*counter.baselineHipY+.005*hipY;counter.baselineLegLength=.995*counter.baselineLegLength+.005*legLength}
      renderCounter();emit({type:'frontend-squat-state-v1',phase:counter.phase,repetitions:counter.repetitions,kneeAngle:0,depthPercent:counter.depth*100,totalFrames:counter.total,validFrames:counter.valid});
    }
    function renderCounter(){reps.textContent=counter.repetitions;phase.textContent=phaseLabels[counter.phase];knee.textContent=counter.calibrationFrames<20?'--%':Math.round(counter.depth*100)+'%';frames.textContent=counter.total?Math.round(counter.valid/counter.total*100)+'%':'0%'}
    function chartPoints(key,min,max){return series.map((point,index)=>{const x=series.length===1?0:index/(series.length-1)*360,y=105-(Math.max(min,Math.min(max,Math.abs(point[key])))-min)/(max-min)*95;return x.toFixed(1)+','+y.toFixed(1)}).join(' ')}
    function renderChart(){ $('ratio-line').setAttribute('points',chartPoints('kneeWobblePercent',0,8));$('shift-line').setAttribute('points',chartPoints('centerShiftPercent',0,20));$('valgus-line').setAttribute('points',chartPoints('kneeAngleAsymmetry',0,20)) }
    function handlePython(raw){const result=JSON.parse(raw);if(result.type==='squat-session-report-v1'){showReport(result);return}emit(result);if(result.timelinePoint){series.push(result.timelinePoint);series=series.slice(-20);renderChart()}if(result.analysis?.warnings?.includes('knee_instability'))setStatus('分析提醒：放慢速度，减少膝盖左右晃动');else if(result.analysis?.warnings?.includes('lateral_weight_shift'))setStatus('分析提醒：保持身体居中');else if(result.analysis?.warnings?.includes('pelvis_tilt'))setStatus('分析提醒：保持骨盆水平');else if(result.analysis?.warnings?.includes('trunk_lateral_lean'))setStatus('分析提醒：避免躯干向一侧倾斜');else if(result.analysis?.warnings?.includes('knee_valgus'))setStatus('辅助提醒：膝盖朝向脚尖');else setStatus('前端计数中 · Python 逐秒分析中')}
    function reportPoints(data,key,min,max){return data.map((point,index)=>{const x=data.length===1?0:index/(data.length-1)*300,y=92-(Math.max(min,Math.min(max,Math.abs(point[key])))-min)/(max-min)*78;return x.toFixed(1)+','+y.toFixed(1)}).join(' ')}
    function miniChart(data,{key,title,unit,min,max,threshold,color}){if(!data.length)return `<div class="mini-chart"><div class="mini-chart-head"><b>${title}</b><span>${unit}</span></div><div class="chart-empty">暂无逐秒数据</div></div>`;const thresholdY=92-(threshold-min)/(max-min)*78;return `<div class="mini-chart"><div class="mini-chart-head"><b>${title}</b><span>${unit} · 虚线为关注线 ${threshold}</span></div><svg viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="${title}逐秒趋势"><path d="M0 14H300M0 53H300M0 92H300" stroke="#e3ebe6"/><path d="M0 ${thresholdY.toFixed(1)}H300" stroke="#a96917" stroke-dasharray="5 5"/><polyline fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" points="${reportPoints(data,key,min,max)}"/></svg></div>`}
    function showReport(report){
      ending=false;socket?.close();const seconds=(report.durationMs/1000).toFixed(1),stability=report.kneeStabilityScore==null?'--':Math.round(report.kneeStabilityScore),valid=Math.round(report.validFrameRate),fmt=(value,unit)=>value==null?'--':value.toFixed(1)+unit,quality=report.qualityLevel||'low',qualityLabel={good:'采集可靠',caution:'谨慎解读',low:'低可信度'}[quality],recommendations=report.recommendations||['建议调整机位后重新采集。'],conclusion=quality==='low'?'本组画面有效性不足，先改善机位，再判断动作质量。':report.p95KneeWobblePercent>2.5?'本组最需要改善的是膝盖左右晃动；下一组先放慢速度，保持膝部轨迹稳定。':report.partialRepetitions?`膝部轨迹基本稳定，但出现 ${report.partialRepetitions} 次半程动作；下一组优先保证幅度完整。`:`完成 ${report.repetitions} 次，膝部横向轨迹整体稳定。`,rows=report.reps.map(rep=>`<div class="rep-row"><b>#${rep.repId}</b><span>${(rep.durationMs/1000).toFixed(1)} 秒</span><span>${Math.round(rep.maxDepthPercent||0)}%</span><span>${((rep.bottomAtMs-rep.startedAtMs)/1000).toFixed(1)} 秒</span><span class="rep-status">${rep.durationMs<1200?'节奏偏快':'完整'}</span></div>`).join('')||'<p>本次没有完成完整深蹲。</p>';
      reportScreen.innerHTML=`<div class="report-wrap"><header class="report-head"><div><div class="eyebrow" style="color:#176a48">SESSION COMPLETE</div><h2>正面深蹲报告</h2></div><small>二维视觉动作指标 · 非医学诊断</small></header><div class="quality-banner" data-level="${quality}"><b>${qualityLabel} · 有效帧 ${valid}%</b>${report.qualityMessage||'分析服务未返回完整质量信息。'}</div><div class="report-kpis"><div class="report-kpi"><strong>${report.repetitions}</strong><span>完整次数</span><small>完成下蹲—底部—站起</small></div><div class="report-kpi"><strong>${stability}</strong><span>膝稳定性 / 100</span><small>${quality==='low'?'数据不足，暂不评分':'横向轨迹波动 P95'}</small></div><div class="report-kpi"><strong>${report.kneeSynchronyScore==null?'--':Math.round(report.kneeSynchronyScore)}</strong><span>左右膝同步 / 100</span><small>左右屈伸速度是否一致</small></div><div class="report-kpi"><strong>${report.repetitionConsistencyScore==null?'--':Math.round(report.repetitionConsistencyScore)}</strong><span>重复一致性 / 100</span><small>${report.reps.length<2?'至少完成 2 次后评分':'动作时长与幅度变异'}</small></div></div><div class="report-conclusion">${conclusion}</div><div class="report-body"><article class="report-card"><h3>逐秒趋势 · ${seconds} 秒</h3><div class="small-multiples">${miniChart(report.timeline,{key:'kneeWobblePercent',title:'膝部横向波动',unit:'站距 %',min:0,max:8,threshold:2.5,color:'#b75237'})}${miniChart(report.timeline,{key:'centerShiftPercent',title:'身体中心偏移',unit:'站距 %',min:0,max:20,threshold:10,color:'#227da6'})}${miniChart(report.timeline,{key:'kneeAngleAsymmetry',title:'左右膝角差',unit:'°',min:0,max:20,threshold:12,color:'#18875b'})}${miniChart(report.timeline,{key:'pelvisTiltDeg',title:'骨盆侧倾',unit:'°',min:0,max:12,threshold:4,color:'#8b61a8'})}${miniChart(report.timeline,{key:'trunkLateralLeanDeg',title:'躯干侧倾',unit:'°',min:0,max:15,threshold:5,color:'#ad6f20'})}</div></article><aside class="report-card"><h3>稳健摘要</h3><div class="summary-list"><div class="summary-item"><span>膝部横向波动 P95 · 主要指标</span><b>${fmt(report.p95KneeWobblePercent,'%')}</b></div><div class="summary-item"><span>身体中心偏移 P95</span><b>${fmt(report.p95CenterShiftPercent,'%')}</b></div><div class="summary-item"><span>骨盆侧倾 P95</span><b>${fmt(report.p95PelvisTiltDeg,'°')}</b></div><div class="summary-item"><span>躯干侧倾 P95</span><b>${fmt(report.p95TrunkLateralLeanDeg,'°')}</b></div><div class="summary-item"><span>左右膝角差 P95</span><b>${fmt(report.p95KneeAngleAsymmetry,'°')}</b></div><div class="summary-item"><span>膝内移 P95 · 辅助观察</span><b>${fmt(report.p95ValgusPercent,'%')}</b></div></div><h3 style="margin-top:20px">下一组建议</h3><ul class="recommendations">${recommendations.map(item=>`<li>${item}</li>`).join('')}</ul></aside></div><article class="report-card" style="margin-top:18px"><h3>逐次动作</h3><div class="rep-table"><div class="rep-row" data-head="true"><span>次数</span><span>总用时</span><span>最大下降幅度</span><span>下降耗时</span><span>判定</span></div>${rows}</div></article><div class="report-actions"><button onclick="location.reload()">开始新一组</button></div></div>`;
      reportScreen.hidden=false;endButton.hidden=true;setStatus('分析完成');
    }
    function connectAnalysis(){
      const configured=new URLSearchParams(location.search).get('analysisUrl'),protocol=location.protocol==='https:'?'wss:':'ws:',url=configured||`${protocol}//${location.hostname}:8765/ws/squat`;
      socket=new WebSocket(url);connection.dataset.online='false';connectionText.textContent='正在连接';
      socket.addEventListener('open',()=>{connection.dataset.online='true';connectionText.textContent='分析在线';setStatus('已开始：前端计数 · Python 分析')});
      socket.addEventListener('message',event=>handlePython(event.data));
      socket.addEventListener('close',()=>{connection.dataset.online='false';connectionText.textContent='分析离线';if(running)setStatus('前端继续计数 · Python 分析已断开',true)});
      socket.addEventListener('error',()=>{connection.dataset.online='false';connectionText.textContent='分析离线'});
    }
    function sendFrame(lm){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({version:1,sequence:sequence++,timestampMs:performance.now(),landmarks:lm.map(({x,y,z,visibility})=>({x,y,z,visibility}))}))}
    function onResults(results){
      const width=video.videoWidth||1280,height=video.videoHeight||720;if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}ctx.clearRect(0,0,width,height);
      if(!results.poseLandmarks){setStatus('请后退，让全身进入画面');return}
      drawConnectors(ctx,results.poseLandmarks,POSE_CONNECTIONS,{color:'#62efad',lineWidth:4});drawLandmarks(ctx,results.poseLandmarks,{color:'#fff',fillColor:'#168a60',lineWidth:2,radius:5});
      updateCounter(results.poseLandmarks);sendFrame(results.poseLandmarks);
    }
    const pose=new Pose({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`});pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5,staticImageMode:false});pose.onResults(onResults);
    async function startAnalysis(){
      if(running)return;startButton.disabled=true;setStatus('正在启动摄像头…');try{if(stage.requestFullscreen){await stage.requestFullscreen();enteredFullscreen=true}}catch(_){}
      try{camera=new Camera(video,{onFrame:async()=>pose.send({image:video}),width:1280,height:720,facingMode:'user'});await camera.start();running=true;sessionStartedAt=performance.now();startScreen.hidden=true;endButton.hidden=false;connectAnalysis();setStatus('已开始前端计数，正在连接 Python…')}
      catch(error){startButton.disabled=false;setStatus(error?.name==='NotReadableError'?'摄像头正被其他应用占用':error?.name==='NotAllowedError'?'请允许浏览器使用摄像头':'无法打开摄像头，请检查设备',true)}
    }
    function endAnalysis(){if(!running||ending)return;ending=true;if(counter.repStartedAt!==undefined)counter.partialRepetitions++;camera?.stop();running=false;endButton.disabled=true;setStatus('正在生成分析报告…');const payload={type:'session-end-v1',durationMs:performance.now()-sessionStartedAt,repetitions:counter.repetitions,partialRepetitions:counter.partialRepetitions,reps:counter.reps},fallback={type:'squat-session-report-v1',...payload,validFrameRate:counter.total?counter.valid/counter.total*100:0,qualityLevel:'low',qualityMessage:'Python 分析服务未返回报告，本页仅显示浏览器端计数。',medianKneeDistanceRatio:null,p95KneeAngleAsymmetry:null,p95CenterShiftPercent:null,p95ValgusPercent:null,p95KneeWobblePercent:null,kneeStabilityScore:null,kneeSynchronyScore:null,repetitionConsistencyScore:null,p95PelvisTiltDeg:null,p95TrunkLateralLeanDeg:null,symmetryScore:null,recommendations:['检查 Python 分析服务连接后重新采集。'],warningCounts:{},timeline:series};if(socket?.readyState===WebSocket.OPEN){socket.send(JSON.stringify(payload));setTimeout(()=>{if(ending)showReport(fallback)},3500)}else showReport(fallback)}
    function stop(){camera?.stop();socket?.close();running=false;startButton.disabled=false;endButton.hidden=true;startScreen.hidden=false;ctx.clearRect(0,0,canvas.width,canvas.height);setStatus('已停止分析')}
    startButton.addEventListener('click',startAnalysis);endButton.addEventListener('click',endAnalysis);document.addEventListener('fullscreenchange',()=>{if(enteredFullscreen&&!document.fullscreenElement&&!ending){enteredFullscreen=false;endAnalysis()}});window.addEventListener('pagehide',()=>{camera?.stop();socket?.close()});
  </script>
</body>
