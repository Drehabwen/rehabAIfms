<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>深蹲姿态捕捉</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif}html,body{background:#101915;height:100%;margin:0;overflow:hidden}
    #stage{height:100%;position:relative;width:100%}#video,#canvas{height:100%;inset:0;object-fit:cover;position:absolute;transform:scaleX(-1);width:100%}#canvas{pointer-events:none}
    #start-screen{align-items:center;background:radial-gradient(circle at 50% 35%,#274437,#101915 70%);display:flex;flex-direction:column;inset:0;justify-content:center;padding:24px;position:absolute;text-align:center;z-index:3}
    #start-screen[hidden]{display:none}h1{font-size:clamp(26px,5vw,42px);margin:0 0 10px}p{color:#b9cbc2;line-height:1.6;margin:0 0 26px;max-width:480px}
    button{background:#29a66f;border:0;border-radius:999px;color:#fff;cursor:pointer;font-size:18px;font-weight:800;padding:16px 34px}
    #status{background:rgba(10,20,16,.78);border-radius:999px;bottom:22px;color:#fff;font-size:14px;font-weight:700;left:50%;padding:10px 16px;position:absolute;transform:translateX(-50%);z-index:2;white-space:nowrap}
    #status[data-error="true"]{background:rgba(138,38,38,.9)}
    #analysis{display:flex;gap:10px;left:18px;position:absolute;top:18px;z-index:2}#analysis div{background:rgba(10,20,16,.78);border-radius:14px;min-width:72px;padding:10px 12px;text-align:center}#analysis strong{display:block;font-size:24px}#analysis span{color:#b9cbc2;font-size:11px}
  </style>
</head>
<body>
  <main id="stage">
    <video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas>
    <aside id="analysis"><div><strong id="reps">0</strong><span>完整次数</span></div><div><strong id="phase">待机</strong><span>动作阶段</span></div><div><strong id="knee">--°</strong><span>膝关节角</span></div><div><strong id="frames">0%</strong><span>有效帧</span></div></aside>
    <div id="status">等待开始</div>
    <section id="start-screen"><h1>深蹲姿态捕捉</h1><p>点击后进入全屏并调用本机摄像头。请让全身保持在画面内，系统会连续绘制骨骼并计算动作时序。</p><button id="start" type="button">开始捕捉</button></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
  <script>
    const stage=document.getElementById('stage'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),context=canvas.getContext('2d'),startScreen=document.getElementById('start-screen'),startButton=document.getElementById('start'),status=document.getElementById('status'),reps=document.getElementById('reps'),phase=document.getElementById('phase'),knee=document.getElementById('knee'),frames=document.getElementById('frames');
    let camera,socket,running=false,enteredFullscreen=false,sequence=0;
    function setStatus(message,error=false){status.textContent=message;status.dataset.error=String(error)}
    function sendFrame(landmarks){
      const message=JSON.stringify({version:1,sequence:sequence++,timestampMs:performance.now(),landmarks:landmarks.map(({x,y,z,visibility})=>({x,y,z,visibility}))});
      if(socket?.readyState===WebSocket.OPEN)socket.send(message);
    }
    function connectAnalysis(){
      if(socket?.readyState===WebSocket.OPEN)return Promise.resolve();
      const configured=new URLSearchParams(location.search).get('analysisUrl');
      const protocol=location.protocol==='https:'?'wss:':'ws:';
      const url=configured||`${protocol}//${location.hostname}:8765/ws/squat`;
      return new Promise((resolve,reject)=>{socket=new WebSocket(url);socket.addEventListener('open',resolve,{once:true});socket.addEventListener('error',()=>reject(new Error('analysis-service-unavailable')),{once:true});socket.addEventListener('message',event=>{if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(event.data);else if(window.parent!==window)window.parent.postMessage(event.data,window.location.origin)});socket.addEventListener('close',()=>{if(running)setStatus('分析服务已断开，请重新开始',true)})});
    }
    const phaseLabels={'finding-subject':'校准','standing':'站立','descending':'下蹲','bottom':'底部','ascending':'站起'};
    window.addEventListener('message',event=>{
      if(event.origin!==window.location.origin||typeof event.data!=='string')return;
      try{const result=JSON.parse(event.data);if(result.type!=='squat-analysis')return;reps.textContent=String(result.repetitions);phase.textContent=phaseLabels[result.phase]||result.phase;knee.textContent=Number.isFinite(result.kneeAngle)?Math.round(result.kneeAngle)+'°':'--°';frames.textContent=result.totalFrames?Math.round(result.validFrames/result.totalFrames*100)+'%':'0%';if(!result.qualityValid&&result.totalFrames>0)setStatus(result.qualityIssue==='low-visibility'?'请后退，确保全身入镜':'正在重新校准')}catch(_){}
    });
    function onResults(results){
      const width=video.videoWidth||1280,height=video.videoHeight||720;
      if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}
      context.clearRect(0,0,width,height);
      if(!results.poseLandmarks){setStatus('请让全身进入画面');return}
      drawConnectors(context,results.poseLandmarks,POSE_CONNECTIONS,{color:'#63E6A5',lineWidth:4});
      drawLandmarks(context,results.poseLandmarks,{color:'#FFFFFF',fillColor:'#1B9C68',lineWidth:2,radius:5});
      setStatus('正在捕捉并实时计算');sendFrame(results.poseLandmarks);
    }
    const pose=new Pose({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${file}`});
    pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5,staticImageMode:false});pose.onResults(onResults);
    async function startCapture(){
      if(running)return;startButton.disabled=true;setStatus('正在启动摄像头…');
      try{if(stage.requestFullscreen){await stage.requestFullscreen();enteredFullscreen=true}}catch(_){}
      try{await connectAnalysis();camera=new Camera(video,{onFrame:async()=>pose.send({image:video}),width:1280,height:720,facingMode:'user'});await camera.start();running=true;startScreen.hidden=true;setStatus('请站到画面中央')}
      catch(error){startButton.disabled=false;const message=error?.message==='analysis-service-unavailable'?'Python 分析服务未启动':error?.name==='NotReadableError'?'摄像头正被其他应用占用':error?.name==='NotAllowedError'?'请允许浏览器使用摄像头':'无法打开摄像头，请检查设备';setStatus(message,true);console.error('无法启动捕捉：',error)}
    }
    function stopCapture(){camera?.stop();socket?.close();running=false;startButton.disabled=false;startScreen.hidden=false;context.clearRect(0,0,canvas.width,canvas.height);setStatus('已停止捕捉')}
    startButton.addEventListener('click',startCapture);
    document.addEventListener('fullscreenchange',()=>{if(enteredFullscreen&&!document.fullscreenElement){enteredFullscreen=false;stopCapture()}});
    window.addEventListener('pagehide',stopCapture);
  </script>
</body>
</html>
